name: TransChap-merchants

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [internal]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_PORT: "7071"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      UPLOADS_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:7071:7071"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7071/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:7071
        NEXT_PUBLIC_DEBUG: "false"
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:7071
      NEXT_PUBLIC_DEBUG: "false"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "7070:7070"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7070/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks: [internal]

networks:
  internal:

volumes:
  mysql_data:
  backend_uploads:
