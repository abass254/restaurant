# Snippet for /etc/apache2/sites-available/transchap-7070-le-ssl.conf
#
# Meta registers https://transchap.app/instagram/callback for production OAuth.
# Route callbacks to the prod FastAPI stack (:7071), NOT the UAT dev API (:7001).
# UAT uses its own callback at https://uat.transchap.app/instagram/callback via uat-TransChap-le-ssl.conf.
#
# Place BEFORE the catch-all ProxyPass / → :7070

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass /instagram/callback http://127.0.0.1:7071/instagram/callback
    ProxyPassReverse /instagram/callback http://127.0.0.1:7071/instagram/callback
    ProxyPass /auth/instagram/callback http://127.0.0.1:7071/auth/instagram/callback
    ProxyPassReverse /auth/instagram/callback http://127.0.0.1:7071/auth/instagram/callback
