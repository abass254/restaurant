<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName dukai.app

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 600

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # FastAPI handles OAuth callbacks, API, uploads, webhooks, and robots.txt.
    # Route these directly to :7071 so long Instagram publishes are not cut off
    # by the Next.js rewrite proxy on :7070.
    ProxyPass /instagram/callback http://127.0.0.1:7071/instagram/callback
    ProxyPassReverse /instagram/callback http://127.0.0.1:7071/instagram/callback
    ProxyPass /auth/instagram/callback http://127.0.0.1:7071/auth/instagram/callback
    ProxyPassReverse /auth/instagram/callback http://127.0.0.1:7071/auth/instagram/callback
    ProxyPass /api http://127.0.0.1:7071/api
    ProxyPassReverse /api http://127.0.0.1:7071/api
    ProxyPass /uploads http://127.0.0.1:7071/uploads
    ProxyPassReverse /uploads http://127.0.0.1:7071/uploads
    ProxyPass /sanctum http://127.0.0.1:7071/sanctum
    ProxyPassReverse /sanctum http://127.0.0.1:7071/sanctum
    ProxyPass /webhooks http://127.0.0.1:7071/webhooks
    ProxyPassReverse /webhooks http://127.0.0.1:7071/webhooks
    ProxyPass /auth http://127.0.0.1:7071/auth
    ProxyPassReverse /auth http://127.0.0.1:7071/auth
    ProxyPass /mpesa http://127.0.0.1:7071/mpesa
    ProxyPassReverse /mpesa http://127.0.0.1:7071/mpesa
    ProxyPass /robots.txt http://127.0.0.1:7071/robots.txt
    ProxyPassReverse /robots.txt http://127.0.0.1:7071/robots.txt

    # Everything else is the Next.js app.
    ProxyPass / http://127.0.0.1:7070/
    ProxyPassReverse / http://127.0.0.1:7070/

    ErrorLog ${APACHE_LOG_DIR}/uat.ufanisi.net_error.log
    CustomLog ${APACHE_LOG_DIR}/uat.ufanisi.net_access.log combined
RewriteEngine on
# Some rewrite rules in this file were disabled on your HTTPS site,
# because they have the potential to create redirection loops.

# RewriteCond %{SERVER_NAME} =dukai.app
# RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

SSLCertificateFile /etc/letsencrypt/live/dukai.app/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/dukai.app/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
